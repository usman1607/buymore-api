services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5013:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__MyConnectionString: "Host=db;Port=5432;Database=${POSTGRES_DB:-buymoreapi_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JwtSettings__Issuer: ${JWT_ISSUER:-BuyMoreApi}
      JwtSettings__Audience: ${JWT_AUDIENCE:-Audience}
      JwtSettings__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-60}
      Paystack__SecretKey: ${PAYSTACK_SECRET_KEY:-}
      Paystack__PublicKey: ${PAYSTACK_PUBLIC_KEY:-}
      FileStorage__Provider: Local
      FileStorage__Local__RootPath: /app/Storage
    volumes:
      - storage-data:/app/Storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buymoreapi_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-buymoreapi_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  storage-data:
